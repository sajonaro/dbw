  <title id="dbw-arch-title">dbw: how the extension is put together</title>
  <desc id="dbw-arch-desc">Architecture of the dbw VS Code extension: a composition root wires features and shared services inside the extension host; a registry looks up drivers, dialects and query languages, which are plugins implementing the @dbw/core contract, the one focal seam; services connect and query through driver plugins, which reach the databases; PRQL is a query language plugin compiled into the connection's dialect; results render in a webview page.</desc>
