name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gate:
    name: Build, test and package in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run the gate and extract the .vsix
        run: docker build --target dist --output out .
      - uses: actions/upload-artifact@v4
        with:
          name: dbw-vsix
          path: out/*.vsix
