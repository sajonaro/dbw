name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build the gate at this tag and extract the .vsix
        run: docker build --target dist --build-arg DBW_VERSION=${{ steps.v.outputs.version }} --output out .
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.vsix
          generate_release_notes: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish to the VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath out/*.vsix --pat "$VSCE_PAT"
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish out/*.vsix --pat "$OVSX_PAT"
